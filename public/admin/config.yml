backend:
  name: github
  repo: saleem-abbas111/saleem-abbas111.github.io
  branch: main
  base_url: https://portfolio-cms-auth.saleemjk71214.workers.dev
  auth_endpoint: auth

# Images uploaded from the CMS are committed straight into the repo here,
# and the site references them at /assets/uploads/<file>.
media_folder: "public/assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: profile
    label: "Profile / Hero / About / Contact"
    files:
      - file: src/data/profile.json
        name: profile
        label: "Profile"
        fields:
          - { label: "Name", name: name, widget: string }
          - { label: "Title", name: title, widget: string }
          - { label: "Tagline (small pill above name)", name: tagline, widget: string }
          - { label: "Hero summary", name: summary, widget: text }
          - { label: "Photo", name: photoUrl, widget: image, required: false }
          - { label: "Projects count badge (e.g. 15+)", name: projectsCount, widget: string, required: false }
          - { label: "About Me — paragraph 1", name: aboutText1, widget: text, required: false }
          - { label: "About Me — paragraph 2", name: aboutText2, widget: text, required: false }
          - label: "Core Tools"
            name: coreTools
            widget: list
            required: false
            field: { label: "Tool", name: tool, widget: string }
          - { label: "Contact section heading", name: contactHeading, widget: string, required: false }
          - { label: "Contact section subtitle", name: contactSubtitle, widget: string, required: false }
          - { label: "Footer tagline", name: footerTagline, widget: text, required: false }
          - { label: "Built-with note (footer)", name: builtWith, widget: string, required: false }
          - { label: "GitHub URL", name: githubUrl, widget: string, required: false }
          - { label: "LinkedIn URL", name: linkedinUrl, widget: string, required: false }
          - { label: "Email", name: email, widget: string, required: false }
          - { label: "WhatsApp link (e.g. https://wa.me/923...)", name: whatsappUrl, widget: string, required: false }
          - { label: "Resume file", name: resumeUrl, widget: file, required: false }
          - { label: "\"See all projects\" link (GitHub folder)", name: projectsFolderUrl, widget: string, required: false }
          - { label: "\"See all dashboards\" link (GitHub folder)", name: dashboardsFolderUrl, widget: string, required: false }

  - name: experience
    label: "My Journey (Education + Experience)"
    files:
      - file: src/data/experience.json
        name: experience
        label: "Journey"
        fields:
          - name: items
            label: "Timeline items"
            widget: list
            summary: "{{title}}"
            fields:
              - label: "Type"
                name: type
                widget: select
                options: ["education", "work"]
                default: "work"
              - { label: "Title (degree or role)", name: title, widget: string }
              - { label: "Organization", name: organization, widget: string, required: false }
              - { label: "Period (e.g. Jun 2023 – Aug 2023)", name: period, widget: string, required: false }
              - { label: "Relevant courses (education only)", name: courses, widget: text, required: false }
              - label: "Bullet points (work only)"
                name: bullets
                widget: list
                required: false
                field: { label: "Bullet", name: bullet, widget: string }

  - name: skills
    label: "Skills"
    files:
      - file: src/data/skills.json
        name: skills
        label: "Skills"
        fields:
          - label: "Technical Tools"
            name: technical
            widget: list
            field: { label: "Tool", name: tool, widget: string }
          - label: "Analytics Skills"
            name: analytics
            widget: list
            field: { label: "Skill", name: skill, widget: string }
          - label: "Soft Skills"
            name: soft
            widget: list
            field: { label: "Skill", name: skill, widget: string }

  - name: projects
    label: "Featured Projects"
    files:
      - file: src/data/projects.json
        name: projects
        label: "Featured Projects"
        fields:
          - name: items
            label: "Projects"
            widget: list
            summary: "{{title}}"
            fields:
              - { label: "Title", name: title, widget: string }
              - { label: "Description", name: description, widget: text }
              - label: "Tags"
                name: tags
                widget: list
                required: false
                field: { label: "Tag", name: tag, widget: string }
              - { label: "Image", name: image, widget: image, required: false }
              - { label: "GitHub URL", name: githubUrl, widget: string, required: false }
              - { label: "Certificate URL", name: certificateUrl, widget: string, required: false }

  - name: dashboards
    label: "Dashboard Gallery"
    files:
      - file: src/data/dashboards.json
        name: dashboards
        label: "Dashboard Gallery"
        fields:
          - name: items
            label: "Dashboards"
            widget: list
            summary: "{{title}}"
            fields:
              - { label: "Title", name: title, widget: string }
              - { label: "Description", name: description, widget: text }
              - { label: "Tool (Tableau / Power BI)", name: tool, widget: string, required: false }
              - { label: "Image", name: image, widget: image, required: false }
              - { label: "Live embed URL (Tableau Public / Power BI publish-to-web link)", name: embedUrl, widget: string, required: false }
              - { label: "Downloadable workbook link (.twbx / .pbix)", name: liveUrl, widget: string, required: false }

  - name: websites
    label: "Websites"
    files:
      - file: src/data/websites.json
        name: websites
        label: "Websites"
        fields:
          - name: items
            label: "Websites"
            widget: list
            summary: "{{title}}"
            fields:
              - { label: "Title", name: title, widget: string }
              - { label: "Description", name: description, widget: text }
              - { label: "Screenshot", name: image, widget: image, required: false }
              - { label: "Live website URL", name: liveUrl, widget: string, required: false }

  - name: aiCreatives
    label: "AI Creatives"
    files:
      - file: src/data/aiCreatives.json
        name: aiCreatives
        label: "AI Creatives"
        fields:
          - name: ads
            label: "Ads"
            widget: list
            summary: "{{title}}"
            fields:
              - { label: "Title", name: title, widget: string }
              - { label: "Storyboard image (leave empty for video-only)", name: storyboard, widget: image, required: false }
              - { label: "Video", name: video, widget: file }
          - name: posts
            label: "Posts"
            widget: list
            summary: "{{title}}"
            fields:
              - { label: "Title", name: title, widget: string }
              - { label: "Image", name: image, widget: image }

  - name: certifications
    label: "Certifications"
    files:
      - file: src/data/certifications.json
        name: certifications
        label: "Certifications"
        fields:
          - name: items
            label: "Certifications"
            widget: list
            summary: "{{name}}"
            fields:
              - { label: "Name", name: name, widget: string }
              - { label: "Issuer", name: issuer, widget: string, required: false }
              - { label: "Issued date label (e.g. Issued Nov 2025)", name: issuedDate, widget: string, required: false }
              - { label: "Certificate PDF", name: certificateUrl, widget: file, required: false }
